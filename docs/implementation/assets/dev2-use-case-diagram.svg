<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a3a55"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1000" fill="#ffffff"/>
  <text x="560" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1f26">Diagrama de casos de uso — Pakta (Dev 2)</text>

  <!-- system boundary -->
  <rect x="380" y="70" width="470" height="880" rx="10" fill="#eef1fb" stroke="#c7cef0" stroke-width="2"/>
  <text x="615" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1f26">Pakta (Sistema)</text>

  <!-- use cases -->
  <g fill="#4a5fd9">
    <ellipse cx="615" cy="170" rx="140" ry="40"/>
    <ellipse cx="615" cy="300" rx="140" ry="40"/>
    <ellipse cx="615" cy="470" rx="160" ry="52"/>
    <ellipse cx="615" cy="630" rx="140" ry="40"/>
    <ellipse cx="615" cy="760" rx="140" ry="40"/>
    <ellipse cx="615" cy="890" rx="140" ry="40"/>
  </g>
  <g fill="#ffffff" font-size="14" text-anchor="middle" font-weight="600">
    <text x="615" y="175">Cargar evidencia</text>
    <text x="615" y="305">Verificar payable</text>
    <text x="615" y="475">Resolver exception</text>
    <text x="615" y="635">Revalidar payable</text>
    <text x="615" y="765">Definir policy</text>
    <text x="615" y="895">Ver estado global</text>
  </g>

  <!-- include relationships (use case -> use case) -->
  <line x1="615" y1="210" x2="615" y2="258" stroke="#2a3a55" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="640" y="238" font-size="11" fill="#4a5568" font-style="italic">«include»</text>

  <line x1="615" y1="522" x2="615" y2="588" stroke="#2a3a55" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="640" y="560" font-size="11" fill="#4a5568" font-style="italic">«include»</text>

  <!-- actor -> use case associations -->
  <g stroke="#2a3a55" stroke-width="1.5" fill="none">
    <line x1="120" y1="150" x2="475" y2="170"/>
    <line x1="120" y1="150" x2="455" y2="470"/>
    <line x1="120" y1="300" x2="455" y2="470"/>
    <line x1="120" y1="450" x2="455" y2="470"/>
    <line x1="120" y1="600" x2="455" y2="470"/>
    <line x1="120" y1="750" x2="455" y2="470"/>
    <line x1="120" y1="900" x2="455" y2="470"/>
    <line x1="120" y1="900" x2="475" y2="760"/>
    <line x1="1000" y1="890" x2="755" y2="890"/>
  </g>

  <!-- actors (left) -->
  <g stroke="#1c1f26" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- AP -->
    <g transform="translate(100,150)">
      <circle cy="-38" r="12" fill="#ffffff"/>
      <line x1="0" y1="-26" x2="0" y2="14"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/>
      <line x1="0" y1="14" x2="-14" y2="44"/>
      <line x1="0" y1="14" x2="14" y2="44"/>
    </g>
    <!-- Procurement -->
    <g transform="translate(100,300)">
      <circle cy="-38" r="12" fill="#ffffff"/>
      <line x1="0" y1="-26" x2="0" y2="14"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/>
      <line x1="0" y1="14" x2="-14" y2="44"/>
      <line x1="0" y1="14" x2="14" y2="44"/>
    </g>
    <!-- Operations -->
    <g transform="translate(100,450)">
      <circle cy="-38" r="12" fill="#ffffff"/>
      <line x1="0" y1="-26" x2="0" y2="14"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/>
      <line x1="0" y1="14" x2="-14" y2="44"/>
      <line x1="0" y1="14" x2="14" y2="44"/>
    </g>
    <!-- Vendor Master -->
    <g transform="translate(100,600)">
      <circle cy="-38" r="12" fill="#ffffff"/>
      <line x1="0" y1="-26" x2="0" y2="14"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/>
      <line x1="0" y1="14" x2="-14" y2="44"/>
      <line x1="0" y1="14" x2="14" y2="44"/>
    </g>
    <!-- Budget Owner -->
    <g transform="translate(100,750)">
      <circle cy="-38" r="12" fill="#ffffff"/>
      <line x1="0" y1="-26" x2="0" y2="14"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/>
      <line x1="0" y1="14" x2="-14" y2="44"/>
      <line x1="0" y1="14" x2="14" y2="44"/>
    </g>
    <!-- Controller -->
    <g transform="translate(100,900)">
      <circle cy="-38" r="12" fill="#ffffff"/>
      <line x1="0" y1="-26" x2="0" y2="14"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/>
      <line x1="0" y1="14" x2="-14" y2="44"/>
      <line x1="0" y1="14" x2="14" y2="44"/>
    </g>
  </g>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#1c1f26">
    <text x="100" y="220">AP / Finance Ops</text>
    <text x="100" y="370">Procurement</text>
    <text x="100" y="520">Operations</text>
    <text x="100" y="670">Vendor Master</text>
    <text x="100" y="820">Budget Owner</text>
    <text x="100" y="970">Controller</text>
  </g>

  <!-- actor (right) -->
  <g stroke="#1c1f26" stroke-width="2.5" fill="none" stroke-linecap="round">
    <g transform="translate(1020,890)">
      <circle cy="-38" r="12" fill="#ffffff"/>
      <line x1="0" y1="-26" x2="0" y2="14"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/>
      <line x1="0" y1="14" x2="-14" y2="44"/>
      <line x1="0" y1="14" x2="14" y2="44"/>
    </g>
  </g>
  <text x="1020" y="960" font-size="14" font-weight="600" text-anchor="middle" fill="#1c1f26">CFO (solo lectura)</text>
</svg>
